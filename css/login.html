<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login TopFast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .toggle-password {
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: white !important;
        }
    </style>
</head>

<body class="bg-[#3949ab] min-h-screen">
    <!-- Container Utama -->
    <div class="w-full min-h-screen flex flex-col items-center justify-between px-8 py-20">

        <!-- Header Section -->
        <div class="w-full flex flex-col items-center">
            <h1 class="text-white text-4xl font-bold tracking-wider mb-2">MASUK</h1>
            <p class="text-white/80 text-sm font-medium text-center">
                Efisien login ke akun TopFast
            </p>
        </div>

        <!-- Form Login Section -->
        <form method="get" action="https://olshopgue.bukaolshop.site/akun/start_login/"
            class="w-full max-w-sm flex flex-col gap-4">

            <!-- Input Email -->
            <div class="relative w-full">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-envelope text-white/90 text-sm"></i>
                </div>
                <input id="email" type="email" name="email" placeholder="Email Anda"
                    class="w-full h-[54px] bg-white/20 border-2 border-white/40 rounded-lg pl-12 pr-4 text-white placeholder:text-white/70 focus:outline-none focus:border-white/60 transition-all"
                    required>
            </div>

            <!-- Input Password -->
            <div class="relative w-full">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-lock text-white/90 text-sm"></i>
                </div>
                <input id="password" type="password" name="password" placeholder="Kode Sandi"
                    class="w-full h-[54px] bg-white/20 border-2 border-white/40 rounded-lg pl-12 pr-12 text-white placeholder:text-white/70 focus:outline-none focus:border-white/60 transition-all"
                    required>
                <div class="absolute inset-y-0 right-0 pr-4 flex items-center">
                    <i id="toggle-eye" class="fa-solid fa-eye text-white/70 text-sm toggle-password"></i>
                </div>
            </div>

            <!-- Tombol Masuk -->
            <button type="submit"
                class="w-full h-[56px] bg-white rounded-lg shadow-lg mt-6 flex items-center justify-center active:scale-[0.98] transition-transform hover:shadow-xl">
                <span class="text-[#3949ab] font-bold text-base tracking-wide">MASUK</span>
            </button>

        </form>

        <!-- Footer Section -->
        <div class="w-full flex flex-col items-center gap-6">

            <!-- Links -->
            <div class="flex flex-col items-center gap-3">
                <a href="https://olshopgue.bukaolshop.site/akun/lupa_password/"
                    class="text-white/90 text-xs font-medium hover:text-white hover:underline transition-colors">
                    Lupa kode anda? Klik Disini!
                </a>
                <div class="flex items-center gap-1">
                    <span class="text-white/70 text-xs font-medium">Belum punya akun?</span>
                    <a href="#" class="text-white font-bold text-xs hover:underline transition-colors">
                        Daftar Daftar
                    </a>
                </div>
            </div>

            <!-- WhatsApp Button -->
            <a href="https://chat.whatsapp.com/HmsItqa65ei5sFgDiRU9TX"
                class="flex items-center gap-2 px-6 py-3 bg-white/10 border border-white/20 rounded-full hover:bg-white/20 transition-colors">
                <i class="fa-brands fa-whatsapp text-white text-lg"></i>
                <span class="text-white text-xs font-medium">Join Group Kami!</span>
            </a>

        </div>

    </div>

    <!-- JavaScript untuk Toggle Password -->
    <script>
        const passwordInput = document.getElementById('password');
        const toggleEye = document.getElementById('toggle-eye');

        toggleEye.addEventListener('click', function () {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleEye.classList.remove('fa-eye');
                toggleEye.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleEye.classList.remove('fa-eye-slash');
                toggleEye.classList.add('fa-eye');
            }
        });
    </script>

</body>

</html>
